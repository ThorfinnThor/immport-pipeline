name: Flow Cytometry Dataset Discovery

on:
  workflow_dispatch:
  schedule:
    # Runs every Monday at 08:30 UTC
    - cron: "30 8 * * 1"

jobs:
  discover-flow-cytometry-datasets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install discovery dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements_flow_discovery.txt

      - name: Run flow cytometry dataset discovery
        env:
          OUTPUT_DIR: output

          # Optional API tokens. Leave unset if you do not have them.
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}

          # Controls. Increase pages/details if you want broader but slower searches.
          FLOW_DISCOVERY_MAX_RESULTS: "250"
          FLOW_DISCOVERY_MIN_SCORE: "2.5"
          ZENODO_MAX_PAGES: "4"
          ZENODO_PAGE_SIZE: "25"
          FIGSHARE_MAX_PAGES: "4"
          FIGSHARE_PAGE_SIZE: "50"
          FIGSHARE_MAX_DETAILS: "120"
          EUROPEPMC_MAX_PAGES: "2"
          EUROPEPMC_PAGE_SIZE: "25"
          IMMPORT_DISCOVERY_ENABLED: "1"
          IMMPORT_MAX_STUDIES: "250"
          CTGOV_ENRICH_ENABLED: "1"
        run: |
          python scripts/run_flow_cytometry_discovery.py

      - name: List output files
        run: |
          echo "---- output/ ----"
          ls -lah output || true

      - name: Upload discovery CSVs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: flow_cytometry_discovery_outputs
          path: output/*.csv

      - name: Send email with discovery CSV attachments
        if: ${{ secrets.SMTP_HOST != '' && secrets.SMTP_PORT != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' && secrets.MAIL_TO != '' && secrets.MAIL_FROM != '' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          python scripts/send_flow_discovery_email.py
